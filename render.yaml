services:
  - type: web
    name: gatekeeper-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run db:setup && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: gatekeeper-db
          property: connectionString

databases:
  - name: gatekeeper-db
    databaseName: gatekeeper
    user: gatekeeper
    plan: basic-256mb
